name: ci

on:
  push:
    branches: ["main"]
  pull_request:

# No secrets are used: tests are hermetic (httptest, no live session, no
# network credentials). The CLI's only credential source is the user's local
# Chrome/OS-keychain at runtime — never CI.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # Node runs the embedded cookie helper in the auth end-to-end test
      # (fake Chrome profile; skipped when node is missing).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: go build ./...
      - run: go vet ./...
      - name: full test suite (all packages must pass, race-enabled)
        run: go test ./... -race
      - name: per-package coverage floors (critical logic/security packages)
        # Honest gate: we floor the correctness/security/parsing packages that
        # are unit-testable. The command layer (internal/cli glue) and
        # the live bank flows are validated by the documented end-to-end LIVE
        # BACKTEST, not by mocked units. internal/auth runs its embedded node
        # helper against a fake Chrome profile, so it is floored too —
        # a gamed total-% would be less assurance, not more. See CLAUDE.md
        # "Testing & coverage policy".
        run: |
          set -euo pipefail
          declare -A floor=( [auth]=75 [client]=80 [config]=75 [htmlx]=80 [out]=75 [version]=90 )
          fail=0
          for pkg in "${!floor[@]}"; do
            pct="$(go test ./internal/$pkg/ -cover | sed -n 's/.*coverage: \([0-9.]*\)%.*/\1/p')"
            echo "internal/$pkg: ${pct}% (floor ${floor[$pkg]}%)"
            awk -v c="${pct:-0}" -v f="${floor[$pkg]}" 'BEGIN{ exit !(c+0 >= f+0) }' || { echo "  BELOW FLOOR"; fail=1; }
          done
          exit $fail

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall
          args: --timeout=4m

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # The embedded sweet-cookie must be the npm 0.2.0 tarball, byte for byte.
  verify-vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: bash scripts/verify-sweetcookie.sh
